services:
  db:
    image: postgres:16-alpine
    container_name: eventroll-db
    environment:
      POSTGRES_USER: eventroll
      POSTGRES_PASSWORD: eventroll
      POSTGRES_DB: eventroll
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventroll -d eventroll']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
